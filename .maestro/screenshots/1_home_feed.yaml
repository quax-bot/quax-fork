appId: com.teskann.quax
name: Should take the screenshot of the home feed of a visitor's subscriptions
---
- launchApp
- openLink:
    link: https://x.com/FlutterDev
    autoVerify: true
- assertVisible: "(?s).*@FlutterDev.*"
- tapOn: "Show menu"
- tapOn: "Subscribe"
- openLink:
    link: https://x.com/dart_lang
    autoVerify: true
- assertVisible: "(?s).*@dart_lang.*"
- tapOn: "Show menu"
- tapOn: "Subscribe"
- back
- back
- tapOn: "(?s)Home.*"
- tapOn: "Hide the release notes"
- assertVisible: "(?s).*(@FlutterDev|@dart_lang).*"
# Scrolls past the first posts, whose link previews X no longer serves
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 40%
      - waitForAnimationToEnd:
          timeout: 4000
# Scrolling back up a little shows the app bar again
- swipe:
    start: 50%, 40%
    end: 50%, 50%
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "1"
