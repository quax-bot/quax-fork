name: emulator

# Runs the Maestro flows of .maestro on an Android emulator, against the mock of X (tool/mock_x), and
# records a video of each. The APK, Gradle, the booted emulator and Maestro are cached, so a run
# where only the flows changed skips the build and boots from a snapshot. The caches are saved
# as soon as they are built, so that a run whose flows fail still fills them for the next one.

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: >
          Git ref of the app to test, e.g. the base branch to record the behaviour before a fix.
          The flows always come from the ref the workflow runs on. Empty tests that same ref.
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/emulator.yml
      - .maestro/**
      - tool/mock_x/**

env:
  MAESTRO_VERSION: 2.10.0
  # The folder the app is built from, with a trailing slash, or nothing for the repository itself
  APP: ${{ inputs.app_ref && 'app/' || '' }}

jobs:
  emulator:
    name: Run the flows on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Clone the app to test
        if: inputs.app_ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.app_ref }}
          path: app

      - name: Install and set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25.x'
          cache: gradle

      - name: Install and set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ${{ env.APP }}.fvmrc
          cache: true

      - name: Restore the APK
        id: apk
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: mock-apk
          key: mock-apk-${{ hashFiles(format('{0}lib/**', env.APP), format('{0}android/**', env.APP), format('{0}assets/**', env.APP), format('{0}pubspec.*', env.APP), format('{0}generate_icons.py', env.APP), format('{0}.fvmrc', env.APP)) }}

      - name: Generate icons
        if: steps.apk.outputs.cache-hit != 'true'
        uses: ./.github/actions/generate-icons
        with:
          working-directory: ./${{ env.APP }}

      # A profile build, as smooth as a release one
      - name: Build a profile APK that talks to the mock of X
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: ./${{ env.APP }}
        run: |
          flutter config --no-analytics
          flutter pub get
          dart run flutter_launcher_icons
          dart run dart_pubspec_licenses:generate
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          flutter build apk --profile --no-tree-shake-icons --target-platform android-x64 \
            --dart-define=QUAX_MOCK_X=http://localhost:8787
          mkdir -p "$GITHUB_WORKSPACE/mock-apk"
          cp build/app/outputs/flutter-apk/app-profile.apk "$GITHUB_WORKSPACE/mock-apk/"

      - name: Save the APK
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: mock-apk
          key: ${{ steps.apk.outputs.cache-primary-key }}

      - name: Restore Maestro
        id: maestro
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/maestro-cli
          key: maestro-${{ env.MAESTRO_VERSION }}

      - name: Install Maestro
        if: steps.maestro.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/maestro" ~/maestro-cli

      - name: Save Maestro
        if: steps.maestro.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/maestro-cli
          key: ${{ steps.maestro.outputs.cache-primary-key }}

      - name: Put Maestro on the path
        run: echo "$HOME/maestro-cli/bin" >> "$GITHUB_PATH"

      # Cuts the start of the videos, see tool/mock_x/emulator_qa.sh
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Start the mock of X
        run: |
          mkdir -p emulator-output
          flutter pub get
          nohup dart run tool/mock_x/server.dart > emulator-output/mock_x.log 2>&1 &
          timeout 120 bash -c 'until grep -q listening emulator-output/mock_x.log; do sleep 1; done'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore the emulator snapshot
        id: avd
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6

      - name: Create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot"

      - name: Save the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}

      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash tool/mock_x/emulator_qa.sh mock-apk/app-profile.apk .maestro emulator-output/mock_x.log emulator-output

      - name: Archive the videos and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: emulator-output
          path: emulator-output
          # Maestro writes its screenshots and logs in a .maestro folder
          include-hidden-files: true
